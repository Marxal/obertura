name: Deploy to GitHub Pages

# This used to build and deploy the full trainer app — the "internal test
# mirror" build target described in CLAUDE.md. That app now lives at
# bitochess.com (the Cloudflare Pages build, unaffected by this workflow);
# this GitHub Pages URL is retired and serves only a static goodbye page
# (farewell/) that still lets a tester export their local data. No build step
# is needed for it, so this workflow no longer runs npm at all.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Switch Pages source to GitHub Actions mode so Jekyll never overwrites this deploy
      - name: Ensure Pages uses GitHub Actions source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}' || true

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: farewell

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
