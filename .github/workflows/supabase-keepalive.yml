name: Supabase keepalive

# Supabase's free tier pauses a project after ~7 days with no activity, and
# waking it back up is a manual click in the dashboard. This job makes one
# tiny read every three days so the clock never gets near seven.
#
# It needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  the public anon/publishable key — NOT service_role
#
# Nothing else in the repo depends on this workflow. If it fails, the only
# consequence is the failure email GitHub sends you.

on:
  schedule:
    # 05:12 UTC on the 1st, 4th, 7th … 31st. Day-of-month stepping means the
    # turn of a short month can stretch one gap to four days, which is still
    # comfortably inside the seven-day pause window.
    - cron: '12 5 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::SUPABASE_URL and/or SUPABASE_ANON_KEY are not set as repository secrets, so nothing was pinged."
            exit 1
          fi

          # Strip a trailing slash so the URL joins cleanly either way.
          base="${SUPABASE_URL%/}"

          # The lightest read there is: ask for a count and zero rows. Row-level
          # security means the anon key sees no rows at all — that is fine and
          # expected. The point is that Postgres was asked a question.
          url="${base}/rest/v1/profiles?select=id&limit=1"

          status=""
          for attempt in 1 2 3; do
            if [ "${attempt}" -gt 1 ]; then
              echo "Retrying in $((attempt * 5))s (attempt ${attempt} of 3)…"
              sleep $((attempt * 5))
            fi

            status=$(curl -sS \
              --max-time 30 \
              -o body.txt -D headers.txt \
              -w '%{http_code}' \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "Prefer: count=exact" \
              -H "Range: 0-0" \
              "${url}") && break

            echo "curl could not reach the project (attempt ${attempt} of 3)."
            status=""
          done

          if [ -z "${status}" ]; then
            echo "::error::Could not reach ${base} after 3 attempts. The project may be paused or the URL may be wrong."
            exit 1
          fi

          echo "HTTP ${status}"
          grep -i '^content-range:' headers.txt || true
          head -c 400 body.txt; echo

          case "${status}" in
            2*)
              echo "Project is awake; the inactivity timer has been reset."
              ;;
            401|403|404)
              # Postgres itself answered — a permissions or missing-table reply
              # still counts as activity — but the query is not the one intended,
              # so say so loudly rather than quietly trusting it forever.
              echo "::warning::Reached the project but got HTTP ${status}. That still counts as activity, but check the anon key and that the 'profiles' table exists."
              ;;
            *)
              echo "::error::Unexpected HTTP ${status} from the Supabase REST API."
              exit 1
              ;;
          esac
