<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Obertura</title>
    <meta name="description" content="Personal chess openings trainer" />
    <meta name="theme-color" content="#f3ead7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Obertura" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <script>
      // Apply the saved (or system) theme before first paint so there's no
      // flash of the wrong theme. Mirrors src/theme.ts — keep the key + colours
      // in sync. JS resolves "auto" to light/dark; CSS only ever sees those two.
      (function () {
        try {
          var choice = localStorage.getItem('obertura-theme') || 'auto';
          var dark =
            choice === 'dark' ||
            (choice === 'auto' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var eff = dark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', eff);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#1a1512' : '#f1ece1');
          // Board colours + paper texture (see appearance.ts) — applied here too
          // so there's no flash of the default scheme before the app boots.
          var board = localStorage.getItem('obertura.boardColour');
          if (board && board !== 'wood') document.documentElement.setAttribute('data-board', board);
          if (localStorage.getItem('obertura.paperTexture') === 'off')
            document.documentElement.setAttribute('data-paper', 'off');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="header-top">
          <div class="header-left">
            <button id="nav-back" class="nav-back" type="button" aria-label="Back" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
            <h1>Obertura</h1>
          </div>
          <button id="nav-settings" class="nav-settings" type="button" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
          <button id="header-save" class="header-save" type="button" hidden><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg><span id="header-save-label">Save line</span></button>
        </div>
      </header>
      <main>
        <div id="view-builder">
          <div id="eval-bar-top"></div>
          <div id="board-wrap">
            <div id="board"></div>
          </div>
          <div id="eval-controls"></div>
          <div id="line-panel">
            <div class="moves-block">
              <div id="move-list"></div>
            </div>

            <div class="line-title-row">
              <span class="colour-pip colour-pip--white" id="title-pip" aria-hidden="true"></span>
              <div class="opening-name" id="opening-name" aria-live="polite"></div>
              <button id="rename-btn" type="button" class="rename-btn" aria-label="Edit name and tags" title="Edit name & tags"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg></button>
            </div>
            <div id="builder-tags" class="builder-tags" hidden></div>

            <div id="move-explanation" class="move-explanation" hidden aria-live="polite"></div>
            <div id="note-panel" hidden>
              <div class="note-panel-head">
                <label id="note-panel-label" class="note-panel-label" for="move-note-input">Note for this move</label>
                <div class="note-panel-actions">
                  <button id="note-add-btn" type="button" class="note-icon-btn" aria-label="Add suggestion to note" title="Add suggestion to note" hidden><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
                  <button id="note-write-btn" type="button" class="note-icon-btn" aria-label="Write a note" title="Write a note"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4"/><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/></svg></button>
                </div>
              </div>
              <div id="annotation-picker" class="annotation-picker" role="group" aria-label="Annotation mark"></div>
              <textarea id="move-note-input" class="note-panel-textarea" placeholder="Reminder or plan for this move…" rows="2" hidden></textarea>
            </div>
          </div>
          <div id="builder-bar" class="builder-bar">
            <div class="builder-bar-group">
              <button id="board-flip" type="button" class="bar-btn" aria-label="Flip board view" title="Flip board"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg></button>
              <button id="watch-btn" type="button" class="bar-btn watch-btn" aria-label="Watch line" title="Watch line"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" stroke="none" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button>
            </div>
            <div class="builder-bar-group">
              <button id="move-prev" type="button" class="bar-btn" aria-label="Step back" title="Back"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
              <button id="move-next" type="button" class="bar-btn" aria-label="Step forward" title="Forward"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
            </div>
          </div>
        </div>

        <div id="view-lines" hidden></div>
        <div id="view-explore" hidden></div>
        <div id="view-train" hidden></div>
        <div id="view-progress" hidden></div>
        <div id="view-settings" hidden></div>
      </main>
      <nav id="bottom-nav" class="tab-bar" aria-label="Primary navigation">
        <button class="tab-item active" data-view="train" type="button" aria-current="page"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg><span>Train</span></button>
        <button class="tab-item" data-view="lines" type="button"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/></svg><span>My Lines</span></button>
        <button class="tab-item" data-view="explore" type="button"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg><span>Explore</span></button>
        <button class="tab-item" data-view="progress" type="button"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" x2="12" y1="20" y2="10"/><line x1="18" x2="18" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="16"/></svg><span>Statistics</span></button>
      </nav>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
