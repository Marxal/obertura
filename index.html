<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Obertura</title>
    <meta name="description" content="Personal chess openings trainer" />
    <meta name="theme-color" content="#f3ead7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Obertura" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <!-- Google Fonts — Silkscreen (weight 400) for the wordmark only. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" />
    <script>
      // Apply the saved (or system) theme before first paint so there's no
      // flash of the wrong theme. Mirrors src/theme.ts — keep the keys, the
      // pre-v1.3 migration, and the colours in sync. JS resolves the choice to
      // light/dark/game; CSS only ever sees those three.
      (function () {
        try {
          var raw = localStorage.getItem('obertura-theme') || 'system';
          var choice =
            raw === 'light' ? 'classic-light'
            : raw === 'dark' ? 'classic-dark'
            : raw === 'auto' ? 'system'
            : raw === 'game' ? 'elegant' // migrated: "Game" renamed to "Elegant"
            : raw;
          var eff;
          if (choice === 'classic-light') eff = 'light';
          else if (choice === 'classic-dark') eff = 'dark';
          else if (choice === 'elegant') eff = 'game';
          else if (choice === 'gamer') eff = 'gamer';
          else eff = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', eff);
          var meta = document.querySelector('meta[name="theme-color"]');
          var color = eff === 'dark' ? '#1a1512' : eff === 'game' ? '#1e3128' : eff === 'gamer' ? '#0e1020' : '#f1ece1';
          if (meta) meta.setAttribute('content', color);
          // Board colours (see appearance.ts) — applied here too so there's no
          // flash of the default scheme before the app boots.
          var board = localStorage.getItem('obertura.boardColour');
          if (board && board !== 'wood') document.documentElement.setAttribute('data-board', board);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="header-top">
          <div class="header-left">
            <button id="nav-back" class="nav-back" type="button" aria-label="Back" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
            <h1 id="header-title">Obertura</h1>
          </div>
          <button id="nav-settings" class="nav-settings" type="button" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
          <button id="header-save" class="header-save" type="button" hidden><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg><span id="header-save-label">Save line</span></button>
        </div>
      </header>
      <main>
        <div id="view-builder">
          <div id="board-wrap">
            <div id="board"></div>
          </div>
          <div class="moves-block">
            <div id="move-list"></div>
          </div>
          <div id="builder-carousel" class="builder-carousel">
            <section class="builder-slide" id="slide-line" aria-label="This line">
              <div id="line-panel">
                <div class="line-title-row">
                  <span class="colour-pip colour-pip--white" id="title-pip" aria-hidden="true"></span>
                  <div class="opening-name" id="opening-name" aria-live="polite"></div>
                </div>
                <div class="line-actions">
                  <button id="rename-btn" type="button" class="line-action" aria-label="Edit name" title="Edit name"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg><span>Title</span></button>
                  <button id="tags-btn" type="button" class="line-action" aria-label="Edit tags" title="Edit tags"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg><span>Tags</span></button>
                  <button id="note-btn" type="button" class="line-action" aria-label="Add a note" title="Add a note"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span id="note-btn-label">Add note</span></button>
                  <button id="explain-btn" type="button" class="line-action" aria-label="Explain this move" title="Explain this move"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></svg><span>Explain</span></button>
                </div>
                <div id="builder-tags" class="builder-tags" hidden></div>
                <div id="builder-desc" class="builder-desc" hidden></div>
                <div id="note-block" class="note-block" hidden>
                  <p id="note-display" class="note-display" hidden></p>
                </div>
                <div id="explain-block" class="explain-block" hidden></div>
              </div>
            </section>
            <section class="builder-slide builder-slide--engine" id="slide-engine" aria-label="Engine">
              <div id="eval-bar-top"></div>
              <div id="eval-controls"></div>
            </section>
            <section class="builder-slide builder-slide--list" id="slide-games" aria-label="Your games"></section>
            <section class="builder-slide builder-slide--list" id="slide-library" aria-label="Opening library"></section>
            <section class="builder-slide builder-slide--list" id="slide-scouting" aria-label="Scouting"></section>
          </div>
          <div id="builder-dock" class="builder-dock">
            <div id="builder-slide-tabs" class="builder-slide-tabs" role="tablist" aria-label="Builder panels">
              <button class="slide-tab slide-tab--on" data-slide="0" type="button" role="tab" aria-selected="true">Line</button>
              <button class="slide-tab" data-slide="1" type="button" role="tab" aria-selected="false">Engine</button>
              <button class="slide-tab" data-slide="2" type="button" role="tab" aria-selected="false">My games</button>
              <button class="slide-tab" data-slide="3" type="button" role="tab" aria-selected="false">Library</button>
              <button class="slide-tab" data-slide="4" type="button" role="tab" aria-selected="false">Scouting</button>
            </div>
            <div id="builder-bar" class="builder-bar">
              <div class="builder-bar-group">
                <button id="board-flip" type="button" class="bar-btn" aria-label="Flip board view" title="Flip board"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg></button>
                <button id="watch-btn" type="button" class="bar-btn watch-btn" aria-label="Watch line" title="Watch line"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" stroke="none" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button>
              </div>
              <div class="builder-bar-group">
                <button id="move-prev" type="button" class="bar-btn bar-btn--step" aria-label="Step back" title="Back"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
                <button id="move-next" type="button" class="bar-btn bar-btn--step" aria-label="Step forward" title="Forward"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
              </div>
            </div>
          </div>
        </div>

        <div id="view-lines" hidden></div>
        <div id="view-explore" hidden></div>
        <div id="view-puzzles" hidden></div>
        <div id="view-train" hidden></div>
        <div id="view-progress" hidden></div>
        <div id="view-settings" hidden></div>
      </main>
      <nav id="bottom-nav" class="tab-bar" aria-label="Primary navigation">
        <button class="tab-item active" data-view="train" type="button" aria-current="page"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg><span>Train</span></button>
        <button class="tab-item" data-view="lines" type="button"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="2.5"/><path d="M9.5 8.5h5"/><path d="M9.5 8.5c0 2.5-1 3.5-2 6.5h9c-1-3-2-4-2-6.5"/><path d="M6 19c.5-2.5 1.5-3 1.5-4h9c0 1 1 1.5 1.5 4z"/></svg><span>My Lines</span></button>
        <button class="tab-item" data-view="explore" type="button"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg><span>Explore</span></button>
        <button class="tab-item" data-view="puzzles" type="button"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4a2 2 0 0 1 4 0c0 .5-.2 1-.5 1.3-.3.4-.5.8-.5 1.2 0 .8.7 1.5 1.5 1.5.4 0 .8-.2 1.2-.5C16 8.2 16.5 8 17 8a2 2 0 0 1 0 4c-.5 0-1-.2-1.3-.5-.4-.3-.8-.5-1.2-.5-.8 0-1.5.7-1.5 1.5 0 .4.2.8.5 1.2.3.3.5.8.5 1.3v3a2 2 0 0 1-2 2H9a1 1 0 0 1-1-1v-2.5c0-.6-.4-1-1-1-.3 0-.6.1-.9.4-.3.3-.7.6-1.1.6a2 2 0 0 1 0-4c.4 0 .8.3 1.1.6.3.3.6.4.9.4.6 0 1-.4 1-1V6a2 2 0 0 1 1-1.7"/></svg><span>Puzzles</span></button>
        <button class="tab-item" data-view="progress" type="button"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" x2="12" y1="20" y2="10"/><line x1="18" x2="18" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="16"/></svg><span>Statistics</span></button>
      </nav>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
