<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Obertura</title>
    <meta name="description" content="Personal chess openings trainer" />
    <meta name="theme-color" content="#f3ead7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Obertura" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <script>
      // Apply the saved (or system) theme before first paint so there's no
      // flash of the wrong theme. Mirrors src/theme.ts — keep the key + colours
      // in sync. JS resolves "auto" to light/dark; CSS only ever sees those two.
      (function () {
        try {
          var choice = localStorage.getItem('obertura-theme') || 'auto';
          var dark =
            choice === 'dark' ||
            (choice === 'auto' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var eff = dark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', eff);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#1a1512' : '#f1ece1');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="header-top">
          <div class="header-left">
            <button id="nav-back" class="nav-back" type="button" aria-label="Back" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
            <h1>Obertura</h1>
          </div>
          <div id="theme-switch" role="group" aria-label="Theme">
            <button type="button" data-theme-choice="light" aria-label="Light theme" title="Light">☀</button>
            <button type="button" data-theme-choice="auto" aria-label="Match system theme" title="Auto">A</button>
            <button type="button" data-theme-choice="dark" aria-label="Dark theme" title="Dark">☾</button>
          </div>
        </div>
      </header>
      <main>
        <div id="view-builder">
          <div id="eval-bar-top"></div>
          <div id="board-wrap">
            <div id="board"></div>
          </div>
          <div id="eval-controls"></div>
          <div id="line-panel">
            <div class="line-title-row">
              <div class="opening-name" id="opening-name" aria-live="polite"></div>
              <button id="watch-btn" type="button" class="watch-btn" aria-label="Watch line" title="Watch line"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" stroke="none" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button>
              <button id="rename-btn" type="button" class="rename-btn" aria-label="Edit name and tags" title="Edit name & tags"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
            </div>
            <div id="builder-tags" class="builder-tags" hidden></div>

            <div class="move-nav">
              <button id="move-first" type="button" class="move-nav-btn move-nav-btn--edge" aria-label="Go to start" title="Start"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/></svg></button>
              <button id="move-prev" type="button" class="move-nav-btn" aria-label="Step back" title="Back"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
              <div id="move-list"></div>
              <button id="move-next" type="button" class="move-nav-btn" aria-label="Step forward" title="Forward"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
              <button id="move-last" type="button" class="move-nav-btn move-nav-btn--edge" aria-label="Go to end" title="End"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 17 5-5-5-5"/><path d="m13 17 5-5-5-5"/></svg></button>
            </div>

            <div id="move-explanation" class="move-explanation" hidden aria-live="polite"></div>
            <div id="note-panel" hidden>
              <div class="note-panel-head">
                <label id="note-panel-label" class="note-panel-label" for="move-note-input">Note for this move</label>
                <div class="note-panel-actions">
                  <button id="note-add-btn" type="button" class="note-icon-btn" aria-label="Add suggestion to note" title="Add suggestion to note" hidden><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
                  <button id="note-write-btn" type="button" class="note-icon-btn" aria-label="Write a note" title="Write a note"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
                </div>
              </div>
              <textarea id="move-note-input" class="note-panel-textarea" placeholder="Reminder or plan for this move…" rows="2" hidden></textarea>
            </div>

            <div id="save-form">
              <div id="save-row">
                <button id="save-btn"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg><span id="save-btn-label">Save line</span></button>
                <button id="reset-btn" type="button" class="reset-btn" aria-label="Reset line" title="Reset line"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
                <button id="train-toggle" type="button" class="dline-toggle" role="switch" aria-checked="false" hidden>
                  <span class="dline-switch"><span class="dline-switch-knob"></span></span>
                  <span class="dline-toggle-label">Training OFF</span>
                </button>
              </div>
              <span id="save-msg" aria-live="polite"></span>
            </div>
          </div>
        </div>

        <div id="view-home" hidden></div>
        <div id="view-lines" hidden></div>
        <div id="view-train" hidden></div>
        <div id="view-progress" hidden></div>
      </main>
      <nav id="bottom-nav" class="tab-bar" aria-label="Primary navigation">
        <button class="tab-item active" data-view="home" type="button" aria-current="page"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v8"/><path d="m4.93 10.93 1.41 1.41"/><path d="M2 18h2"/><path d="M20 18h2"/><path d="m19.07 10.93-1.41 1.41"/><path d="M22 22H2"/><path d="m8 6 4-4 4 4"/><path d="M16 18a4 4 0 0 0-8 0"/></svg><span>Today</span></button>
        <button class="tab-item" data-view="lines" type="button"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/></svg><span>My Lines</span></button>
        <button class="tab-item" data-view="train" type="button"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg><span>Train</span></button>
        <button class="tab-item" data-view="progress" type="button"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" x2="12" y1="20" y2="10"/><line x1="18" x2="18" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="16"/></svg><span>Statistics</span></button>
      </nav>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
