<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Obertura</title>
    <meta name="description" content="Personal chess openings trainer" />
    <meta name="theme-color" content="#f3ead7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Obertura" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Obertura</h1>
      </header>
      <main>
        <div id="board-wrap">
          <div id="board"></div>
        </div>
        <div id="line-panel">
          <div class="opening-name" id="opening-name" aria-live="polite"></div>
          <div id="move-list"></div>
          <button id="reset-btn">Reset line</button>

          <div id="save-form">
            <input id="line-name" type="text" placeholder="Italian Game — main line" />
            <input id="line-tags" type="text" placeholder="tags, comma, separated" />
            <div id="colour-toggle" role="group" aria-label="Repertoire colour">
              <button type="button" data-colour="white" class="active">White</button>
              <button type="button" data-colour="black">Black</button>
            </div>
            <div id="save-row">
              <button id="save-btn">Save line</button>
              <span id="save-msg" aria-live="polite"></span>
            </div>
            <div id="debug-readout"></div>
          </div>

          <details id="settings">
            <summary>Settings</summary>
            <label for="lichess-token">Lichess API token</label>
            <input id="lichess-token" type="password" autocomplete="off"
                   placeholder="Paste token to enable opening names" />
            <span id="token-msg"></span>
            <a href="https://lichess.org/account/oauth/token/create?description=Obertura"
               target="_blank" rel="noopener">Create a free token →</a>
          </details>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
